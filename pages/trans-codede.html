<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transparencia — Gobernación de Baja Verapaz</title>
<meta name="description" content="Informes mensuales de transparencia y ejecución de proyectos del CODEDE Baja Verapaz.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link href="/assets/css/styles.css" rel="stylesheet">
</head>
<body>

     <div id="navbar-container"></div>

<section style="padding-top:30px;padding-bottom:30px;">
  <div class="contenedor">


    <div class="encabezado-seccion" style="margin-bottom:36px;">
      <span class="ojo">Transparencia</span>
      <h2>Transparencia CODEDE</h2>
      <p>Informe mensual de aportes, ejecución física y financiera de los proyectos del Consejo Departamental de Desarrollo de Baja Verapaz.</p>
    </div>

    <div class="grid-transparencia">

      <!-- Columna izquierda: historial de informes agrupado por año (carpetas) -->
      <aside class="panel-historial">
        <h3>
          <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
          Historial de informes
        </h3>
        <div id="historialInformes"></div>
      </aside>

      <!-- Columna derecha: oficio activo -->
      <div class="columna-informe">
        <div class="detalle-tramite" id="panelInforme">

          <!-- Tarjeta con el mes activo y los botones de acción del informe -->
          <div class="tarjeta-oficio acciones-simples">
            <div class="mes-activo">
              <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
              <span id="mesActivoLabel">&nbsp;</span>
            </div>
            <div class="acciones-oficio">
              <a id="btnVerPdf" class="btn-pdf ver" href="#" target="_blank" rel="noopener">
                <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                Ver oficio completo
              </a>
              <a id="btnDescargarPdf" class="btn-pdf descargar" href="#" download>
                <svg class="icono" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
                Descargar PDF
              </a>
            </div>
          </div>
          <!-- Visor embebido del PDF (navegador nativo) -->
          <iframe id="visorPdf" class="visor-pdf" title="Visor del informe en PDF"></iframe>

        </div>
        <!-- Se muestra si el año seleccionado todavía no tiene informes -->
        <div class="detalle-tramite" id="panelVacio" style="display:none;">
          <div class="detalle-vacio">
            <svg class="icono-vacio" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/></svg>
            <p>Aún no hay informes cargados para este período.</p>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>

<!-- El footer se inyecta aquí vía fetch, ver assets/js/main.js -->
<div id="footer-container"></div>

<script src="/assets/js/main.js"></script>
<script src="/assets/js/modals.js"></script>
<script src="/assets/js/transparencia.js"></script>
</body>
</html>
